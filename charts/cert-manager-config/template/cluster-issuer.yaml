apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare

spec:
  acme:
    email: {{ .Values.acmeEmail | quote }}

    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-cloudflare-account

    solvers:
      - selector:
          dnsZones:
{{ toYaml .Values.dnsZones | indent 12 }}

        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflare.secretName | quote }}
              key: api-token