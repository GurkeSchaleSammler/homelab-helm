apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-registry-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-registry-reader-release-note-qa-copilot
  namespace: ai-product-factory
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ghcr-product-images]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-registry-reader-release-note-qa-copilot
  namespace: ai-product-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-registry-reader-release-note-qa-copilot
subjects:
  - kind: ServiceAccount
    name: factory-registry-bootstrap
    namespace: ai-product-release-note-qa-copilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-registry-writer
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-registry-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-registry-writer
subjects:
  - kind: ServiceAccount
    name: factory-registry-bootstrap
    namespace: ai-product-release-note-qa-copilot
---
apiVersion: batch/v1
kind: Job
metadata:
  name: factory-registry-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    spec:
      serviceAccountName: factory-registry-bootstrap
      restartPolicy: Never
      containers:
        - name: copy
          image: alpine/k8s:1.34.1
          command: [sh, -ec]
          args:
            - |
              credential=$(kubectl -n ai-product-factory get secret ghcr-product-images -o jsonpath='{.data.\.dockerconfigjson}')
              printf '%s' "$credential" | base64 -d > /tmp/dockerconfig.json
              kubectl -n ai-product-release-note-qa-copilot create secret generic ghcr-product-images --type=kubernetes.io/dockerconfigjson --from-file=.dockerconfigjson=/tmp/dockerconfig.json --dry-run=client -o yaml | kubectl -n ai-product-release-note-qa-copilot apply -f -
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
