apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "factory-postgresql.fullname" . }}-initdb
  labels:
    {{- include "factory-postgresql.labels" . | nindent 4 }}
data:
  01-runtime-roles.sh: |
    #!/bin/sh
    set -eu

    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=db_name="$POSTGRES_DB" \
      --set=migration_password="$FACTORY_MIGRATION_PASSWORD" \
      --set=innovation_password="$INNOVATION_PASSWORD" \
      --set=sales_password="$SALES_PASSWORD" \
      --set=manager_password="$MANAGER_PASSWORD" <<'EOSQL'
    SELECT 'CREATE ROLE factory_innovation NOLOGIN'
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'factory_innovation')\gexec

    SELECT 'CREATE ROLE factory_sales NOLOGIN'
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'factory_sales')\gexec

    SELECT 'CREATE ROLE factory_manager NOLOGIN'
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'factory_manager')\gexec

    SELECT format('CREATE ROLE factory_migrator LOGIN CREATEROLE PASSWORD %L', :'migration_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'factory_migrator')\gexec
    SELECT format('ALTER ROLE factory_migrator WITH LOGIN CREATEROLE PASSWORD %L', :'migration_password')\gexec

    SELECT format('CREATE ROLE innovation_man LOGIN PASSWORD %L', :'innovation_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'innovation_man')\gexec
    SELECT format('ALTER ROLE innovation_man WITH LOGIN PASSWORD %L', :'innovation_password')\gexec

    SELECT format('CREATE ROLE sales_man LOGIN PASSWORD %L', :'sales_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sales_man')\gexec
    SELECT format('ALTER ROLE sales_man WITH LOGIN PASSWORD %L', :'sales_password')\gexec

    SELECT format('CREATE ROLE manager_man LOGIN PASSWORD %L', :'manager_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'manager_man')\gexec
    SELECT format('ALTER ROLE manager_man WITH LOGIN PASSWORD %L', :'manager_password')\gexec

    GRANT factory_innovation TO innovation_man;
    GRANT factory_sales TO sales_man;
    GRANT factory_manager TO manager_man;

    ALTER DATABASE :"db_name" OWNER TO factory_migrator;
    GRANT ALL ON DATABASE :"db_name" TO factory_migrator;
    EOSQL
