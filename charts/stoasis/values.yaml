nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-stoasis

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/gurkeschalesammler/stoasis-frontend
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/gurkeschalesammler/stoasis-backend
    tag: latest
    pullPolicy: Always
  service:
    port: 4000
  javaToolOptions: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=70"
  skillsEnabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mcp:
  replicaCount: 1
  image:
    repository: ghcr.io/gurkeschalesammler/stoasis-mcp
    tag: latest
    pullPolicy: Always
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgresql:
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  database: stoasis
  username: stoasis
  service:
    port: 5432
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

uploads:
  persistence:
    size: 10Gi
    storageClassName: ""

secrets:
  existingSecret: stoasis-secrets
  keys:
    postgresPassword: postgres-password
    databaseUrl: database-url
    sessionEncryptionKey: session-encryption-key
    resendApiKey: resend-api-key

mail:
  provider: resend
  from: "Stoasis <no-reply@stoasis.ch>"
  resendApiUrl: https://api.resend.com/emails

ingress:
  className: traefik-public
  clusterIssuer: letsencrypt-cloudflare
  frontend:
    enabled: true
    host: app.stoasis.ch
    tlsSecretName: app-stoasis-tls
  mcp:
    enabled: true
    host: mcp.stoasis.ch
    tlsSecretName: mcp-stoasis-tls

nodeSelector: {}
tolerations: []
affinity: {}

