apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stoasis.fullname" . }}-mcp
  labels:
    {{- include "stoasis.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "stoasis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "stoasis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.mcp.service.port | quote }}
            - name: PUBLIC_BASE_URL
              value: "https://{{ .Values.ingress.mcp.host }}"
            - name: STOASIS_API_BASE_URL
              value: "http://{{ include "stoasis.fullname" . }}-backend:{{ .Values.backend.service.port }}"
            - name: STOASIS_WEB_BASE_URL
              value: "https://{{ .Values.ingress.frontend.host }}"
            - name: OAUTH_STORAGE
              value: postgres
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.databaseUrl }}
            - name: SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.sessionEncryptionKey }}
            - name: TRUST_PROXY
              value: "true"
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stoasis.fullname" . }}-mcp
  labels:
    {{- include "stoasis.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  selector:
    {{- include "stoasis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http

