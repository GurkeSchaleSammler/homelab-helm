{{- if .Values.enabled }}
{{- $host := required "host must contain the application's full domain name" .Values.host }}
{{- $class := required "className must explicitly select an Ingress controller" .Values.className }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- with (omit .Values.annotations "kubernetes.io/ingress.class") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    kubernetes.io/ingress.class: {{ $class | quote }}
spec:
  ingressClassName: {{ $class | quote }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "tls.secretName is required when TLS is enabled" .Values.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ required "service.name is required" .Values.service.name | quote }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
