{{- if or .Values.public.address .Values.public.ipv6Address }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-ingress
  namespace: {{ .Release.Namespace }}
spec:
  addresses:
    {{- if .Values.public.address }}
    - {{ .Values.public.address | quote }}
    {{- end }}
    {{- if .Values.public.ipv6Address }}
    - {{ .Values.public.ipv6Address | quote }}
    {{- end }}
  autoAssign: false
{{- end }}

{{- if or .Values.internal.address .Values.internal.ipv6Address }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: internal-ingress
  namespace: {{ .Release.Namespace }}
spec:
  addresses:
    {{- if .Values.internal.address }}
    - {{ .Values.internal.address | quote }}
    {{- end }}
    {{- if .Values.internal.ipv6Address }}
    - {{ .Values.internal.ipv6Address | quote }}
    {{- end }}
  autoAssign: false
{{- end }}
